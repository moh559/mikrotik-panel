<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مسح رمز QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Almarai', Arial, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(34,193,195,1) 21%, rgb(121,25,171) 73%);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      background: #ffffffee; border-radius: 18px; padding: 24px; width: 100%;
      max-width: 420px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    h1 { font-size: 22px; color: #173672; margin-bottom: 6px; }
    p  { font-size: 14px; color: #444; margin-bottom: 14px; }
    video { width: 100%; border-radius: 12px; background: #000; display: none; }
    canvas { display: none; }
    .btn {
      display: block; width: 100%; margin-top: 12px; padding: 14px; border: 0;
      border-radius: 12px; background: #173672; color: #fff; font-size: 16px;
      font-weight: bold; cursor: pointer;
    }
    .btn.secondary { background: #7919ab; }
    .btn.back { background: #555; }
    .note {
      display: none; margin-top: 12px; padding: 10px; border-radius: 8px;
      background: #fff3cd; color: #856404; border: 1px solid #ffe69c; font-size: 13px;
    }
    .error { color: #c00; font-size: 14px; min-height: 20px; margin-top: 10px; }
    .result { color: #097072; font-weight: bold; word-break: break-all; margin-top: 10px; }
    input[type="text"] {
      width: 100%; padding: 12px; margin-top: 12px; border: 2px solid #7919ab;
      border-radius: 10px; font-size: 16px; text-align: center;
    }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>تسجيل الدخول السريع</h1>
    <p>وجّه الكاميرا إلى رمز QR الخاص بالكرت، أو ارفع صورة الرمز</p>

    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>

    <button class="btn" id="startBtn">تشغيل الكاميرا</button>
    <label class="btn secondary" for="fileInput">التقاط / رفع صورة الرمز</label>
    <input type="file" id="fileInput" accept="image/*" capture="environment" />

    <div class="note" id="secureNote">
      المتصفح لا يسمح بتشغيل الكاميرا في الاتصال غير الآمن (HTTP). استخدم زر
      "التقاط / رفع صورة الرمز" — يفتح كاميرا الجهاز مباشرة ويعمل بشكل طبيعي.
    </div>

    <div class="error" id="error"></div>
    <div class="result" id="result"></div>

    <input type="text" id="manualInput" placeholder="أو اكتب رقم الكرت يدوياً" />
    <button class="btn secondary" id="manualBtn">متابعة</button>

    <button class="btn back" onclick="window.location.href='index.html'">العودة للخلف</button>
  </div>

  <script src="js/jsqr.js"></script>
  <script>
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var errorEl = document.getElementById('error');
    var resultEl = document.getElementById('result');
    var stream = null;
    var scanning = false;

    function goToLogin(code) {
      if (!code) return;
      window.location.href = 'index.html?qr=' + encodeURIComponent(code.trim());
    }

    function decodeCanvas() {
      try {
        var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(imgData.data, canvas.width, canvas.height);
        if (code && code.data) {
          resultEl.textContent = 'تم العثور على الرمز: ' + code.data;
          stopCamera();
          setTimeout(function () { goToLogin(code.data); }, 600);
          return true;
        }
      } catch (e) {}
      return false;
    }

    function scanLoop() {
      if (!scanning || video.readyState !== video.HAVE_ENOUGH_DATA) {
        if (scanning) requestAnimationFrame(scanLoop);
        return;
      }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      if (!decodeCanvas()) requestAnimationFrame(scanLoop);
    }

    function startCamera() {
      errorEl.textContent = '';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.getElementById('secureNote').style.display = 'block';
        errorEl.textContent = 'الكاميرا غير متاحة في هذا السياق — استخدم رفع الصورة.';
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function (s) {
          stream = s;
          video.srcObject = s;
          video.style.display = 'block';
          video.play();
          scanning = true;
          document.getElementById('startBtn').textContent = 'الكاميرا تعمل...';
          scanLoop();
        })
        .catch(function (e) {
          document.getElementById('secureNote').style.display = 'block';
          errorEl.textContent = 'تعذر تشغيل الكاميرا: ' + e.message;
        });
    }

    function stopCamera() {
      scanning = false;
      if (stream) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        stream = null;
      }
      video.style.display = 'none';
      document.getElementById('startBtn').textContent = 'تشغيل الكاميرا';
    }

    document.getElementById('startBtn').addEventListener('click', startCamera);

    document.getElementById('fileInput').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      errorEl.textContent = '';
      var img = new Image();
      img.onload = function () {
        var max = 1024;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        if (!decodeCanvas()) {
          errorEl.textContent = 'لم يتم التعرف على رمز QR في الصورة — حاول بصورة أوضح.';
        }
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
      e.target.value = '';
    });

    document.getElementById('manualBtn').addEventListener('click', function () {
      var v = document.getElementById('manualInput').value.trim();
      if (v) goToLogin(v);
      else errorEl.textContent = 'اكتب رقم الكرت أولاً.';
    });

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById('secureNote').style.display = 'block';
    }
  </script>
</body>
</html>
