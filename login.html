<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - لوحة التحكم السحابية</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0d1b2a 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; position: relative; overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(26, 35, 126, 0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(74, 20, 140, 0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(0, 96, 100, 0.15) 0%, transparent 60%);
  pointer-events: none; animation: bgPulse 10s ease-in-out infinite;
}
@keyframes bgPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
.stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
.star {
  position: absolute; width: 3px; height: 3px; background: white; border-radius: 50%;
  animation: twinkle 3s infinite;
}
@keyframes twinkle { 0%,100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
.main-container { position: relative; z-index: 10; width: 100%; max-width: 450px; }
.logo-section { text-align: center; margin-bottom: 30px; }
.logo-icon {
  width: 80px; height: 80px;
  background: linear-gradient(135deg, #1a237e 0%, #4a148c 100%);
  border-radius: 20px; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 15px; box-shadow: 0 15px 40px rgba(26, 35, 126, 0.5);
  animation: logoFloat 3s ease-in-out infinite;
}
@keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.logo-icon i { font-size: 40px; color: white; }
.logo-text { color: white; font-size: 28px; font-weight: 800; margin-bottom: 5px; text-shadow: 0 0 30px rgba(26, 35, 126, 0.5); }
.logo-subtitle { color: rgba(255,255,255,0.6); font-size: 14px; }
.login-container {
  background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px; padding: 40px 35px; border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.login-container h2 { color: white; font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 30px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; color: rgba(255, 255, 255, 0.8); font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.form-group label i { margin-left: 8px; color: #7c4dff; }
.form-control {
  width: 100%; padding: 15px 20px; background: rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white;
  font-size: 16px; font-family: 'Cairo', sans-serif; transition: all 0.3s ease;
}
.form-control:focus { outline: none; border-color: #7c4dff; background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 20px rgba(124, 77, 255, 0.3); }
.form-control::placeholder { color: rgba(255, 255, 255, 0.4); }
.btn {
  width: 100%; padding: 16px; background: linear-gradient(135deg, #1a237e 0%, #4a148c 100%);
  border: none; border-radius: 12px; color: white; font-size: 18px; font-weight: 700;
  font-family: 'Cairo', sans-serif; cursor: pointer; transition: all 0.3s ease;
  box-shadow: 0 10px 30px rgba(26, 35, 126, 0.4); margin-top: 10px;
}
.btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(26, 35, 126, 0.5); }
.btn:active { transform: translateY(-1px); }
.btn i { margin-left: 10px; }
.alert { padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; display: none; font-size: 14px; }
.alert-danger { background: rgba(220, 53, 69, 0.2); border: 1px solid rgba(220, 53, 69, 0.5); color: #ff6b6b; }
.alert-success { background: rgba(40, 167, 69, 0.2); border: 1px solid rgba(40, 167, 69, 0.5); color: #51cf66; }
.hint-box {
  background: linear-gradient(135deg, rgba(26, 35, 126, 0.3) 0%, rgba(74, 20, 140, 0.3) 100%);
  border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 20px;
  margin-top: 25px; text-align: center; color: rgba(255,255,255,0.75); font-size: 13.5px; line-height: 1.8;
}
.hint-box i { color: #69f0ae; margin-left: 6px; }
.footer { margin-top: 30px; text-align: center; color: rgba(255, 255, 255, 0.4); font-size: 13px; }
@media (max-width: 480px) {
  .login-container { padding: 30px 25px; }
  .logo-text { font-size: 24px; }
  .logo-icon { width: 70px; height: 70px; }
  .logo-icon i { font-size: 35px; }
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<script src="config.local.js"></script>
<div class="main-container">
  <div class="logo-section">
    <div class="logo-icon"><i class="fas fa-network-wired"></i></div>
    <h1 class="logo-text">لوحة التحكم السحابية</h1>
    <p class="logo-subtitle">لوحة تحكم إدارة الشبكات والراوترات</p>
  </div>
  <div class="login-container">
    <h2><i class="fas fa-shield-alt" style="margin-left: 10px; color: #7c4dff;"></i> تسجيل الدخول</h2>
    <div class="alert" id="message-box"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="loginNet"><i class="fas fa-wifi"></i> رقم الشبكة</label>
        <input type="number" id="loginNet" class="form-control" placeholder="أدخل رقم الشبكة" required>
      </div>
      <div class="form-group">
        <label for="loginPass"><i class="fas fa-lock"></i> كلمة المرور</label>
        <input type="password" id="loginPass" class="form-control" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
      </div>
      <button type="submit" id="loginBtn" class="btn"><i class="fas fa-sign-in-alt"></i> دخول</button>
    </form>
    <div class="hint-box">
      <i class="fas fa-cloud"></i> اللوحة مستضافة على السحابة — تُفتح من أي جهاز بعد تسجيل الدخول
    </div>
  </div>
  <div class="footer"><p>© 2026 لوحة التحكم السحابية - جميع الحقوق محفوظة</p></div>
</div>
<script>
(function () {
  var i;
  var sc = document.getElementById("stars");
  for (i = 0; i < 50; i++) {
    var st = document.createElement("div");
    st.className = "star";
    st.style.left = Math.random() * 100 + "%";
    st.style.top = Math.random() * 100 + "%";
    st.style.animationDelay = Math.random() * 3 + "s";
    st.style.animationDuration = (2 + Math.random() * 3) + "s";
    sc.appendChild(st);
  }
  if (localStorage.getItem("panel_auth") === "1") { location.replace("index.html"); return; }
  var DEF = { net: "5050", pass: "moh559" };
  var ov = (window.PANEL_CONFIG && window.PANEL_CONFIG.login) || {};
  var NET = ov.net || DEF.net;
  var PASS = ov.pass || DEF.pass;
  var box = document.getElementById("message-box");
  document.getElementById("login-form").onsubmit = function (e) {
    e.preventDefault();
    var net = document.getElementById("loginNet").value.trim();
    var pass = document.getElementById("loginPass").value;
    if (net === NET && pass === PASS) {
      localStorage.setItem("panel_auth", "1");
      box.textContent = "تم تسجيل الدخول بنجاح! جاري تحويلك إلى اللوحة...";
      box.className = "alert alert-success";
      box.style.display = "block";
      setTimeout(function () { location.href = "index.html"; }, 800);
    } else {
      box.textContent = "خطأ في رقم الشبكة أو كلمة المرور";
      box.className = "alert alert-danger";
      box.style.display = "block";
    }
  };
})();
</script>
</body>
</html>
