<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>لوحة التحكم</h1>
    <p class="dim">عرض تفصيلي لإعدادات وتغييرات الراوترات المضافة — بدون صلاحيات تعديل.</p>
  </div>
</header>
<main class="wrap">
  <div id="errorBox" class="alert" hidden></div>
  <section id="listView">
    <h2 class="sect">الراوترات</h2>
    <div id="routers" class="grid"></div>
  </section>
  <section id="detailView" hidden>
    <button id="backBtn" class="btn ghost" type="button">رجوع للقائمة</button>
    <div id="detailHead"></div>
    <div id="dataGrid" class="grid"></div>
    <section class="sect-box">
      <h2 class="sect">آخر التغييرات</h2>
      <ul id="changes" class="changes"><li class="dim">…</li></ul>
    </section>
  </section>
</main>
<footer class="foot wrap">
  <span id="footInfo" class="dim"></span>
</footer>
<script src="js/dashboard.js"></script>
</body>
</html>
